name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm

      - name: Reject restricted test data
        shell: pwsh
        run: |
          $trackedFiles = git ls-files -- 'test-data/'
          if ($trackedFiles) {
            Write-Error "Restricted local test data must not be tracked."
            exit 1
          }

      - name: Install dependencies
        run: npm install

      - name: Restore cached STEP fixture
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: test-data
          key: jama-step-sheet-metal-ap242-p21
          restore-keys: |
            jama-step-

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        env:
          STEP_TEST_URL: ${{ vars.STEP_TEST_URL || 'https://www.jama.or.jp/operation/it/dg_egr/docs/02-01_role_model_data-SMP/Sheet_Metal_Parts_STEP_AP242_P21.zip' }}
        shell: pwsh
        run: npm test

      - name: Build
        run: npm run build
